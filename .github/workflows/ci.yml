name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Configure, build and test every host preset (see CMakePresets.json)
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ debug, debug-clang, tsan, release ]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags for `git describe`

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      # Sanitizers (TSan in particular) fail with the runner's high ASLR entropy
      - name: Reduce ASLR entropy for sanitizers
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcovr

      - name: Build, test and coverage report
        run: ./scripts/coverage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
